[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "Legacy-code modernization system using Hybrid Nested-Orchestration Architecture"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "OpsPilot Team" }
]
dependencies = [
    "pyautogen>=0.2.0",
    "tree-sitter>=0.20.0",
    "networkx>=3.0",
    "jsonschema>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
extension-plots = [
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.scripts]
opspilot = "opspilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
